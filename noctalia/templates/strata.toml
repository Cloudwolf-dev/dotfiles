name = "Noctalia strata"
# The surface tokens are pure grey under m3-rainbow, so the backgrounds are
# taken from primary instead: same lightness as the grey tokens, low saturation.
# The trailing a6 is 0.65 alpha, matching Noctalia's bar opacity. Only the
# window is translucent; ~/.config/strata/style.css clears the panes on top of
# it, and surface stays solid for popovers and dialogs.
background = "{{colors.primary.default.hex | set_lightness: 8 | set_saturation: 20}}a6"
surface = "{{colors.primary.default.hex | set_lightness: 8 | set_saturation: 20}}"
text = "{{colors.on_surface.default.hex}}"
accent = "{{colors.primary.default.hex}}"
danger = "{{colors.error.default.hex}}"
muted = "{{colors.primary.default.hex | set_lightness: 12 | set_saturation: 18}}"
highlight = "{{colors.primary.default.hex | set_lightness: 21 | set_saturation: 16}}"
border = "{{colors.primary.default.hex | set_lightness: 28 | set_saturation: 12}}"
dim_text = "{{colors.on_surface_variant.default.hex}}"
syntax_keyword = "{{colors.terminal_normal_magenta.default.hex}}"
syntax_string = "{{colors.terminal_normal_green.default.hex}}"
syntax_constant = "{{colors.terminal_normal_yellow.default.hex}}"
syntax_type = "{{colors.terminal_normal_cyan.default.hex}}"
syntax_preprocessor = "{{colors.terminal_normal_blue.default.hex}}"
