[preferred]
# Umbriel's backend only implements InputCapture, ScreenCast and Screenshot;
# gtk covers the rest (Settings, OpenURI, Access, ...).
default=umbriel;gtk
# umbriel-full (~/.local/bin/xdg-desktop-portal-umbriel-full) captures every
# output for Flameshot and passes interactive requests on to umbriel.
org.freedesktop.impl.portal.Screenshot=umbriel-full;umbriel
org.freedesktop.impl.portal.ScreenCast=umbriel
org.freedesktop.impl.portal.FileChooser=luciole;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
